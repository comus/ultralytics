# Parameters
nc: 80 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants
  # Custom light scale for pose model targeting mAP50-95 of 0.4
  light: [0.25, 0.25, 512] # significantly reduced width and depth

# YOLO11n-pose lightweight backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2 - reduced from 64 to 32
  - [-1, 1, Conv, [64, 3, 2]] # 1-P2/4 - reduced from 128 to 64
  - [-1, 1, C3k2, [128, False, 0.25]] # reduced repeats from 2 to 1, channels from 256 to 128
  - [-1, 1, Conv, [128, 3, 2]] # 3-P3/8 - reduced from 256 to 128
  - [-1, 1, C3k2, [256, False, 0.25]] # reduced repeats from 2 to 1, channels from 512 to 256
  - [-1, 1, Conv, [256, 3, 2]] # 5-P4/16 - reduced from 512 to 256
  - [-1, 1, C3k2, [256, True]] # reduced repeats from 2 to 1, channels from 512 to 256
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32 - reduced from 1024 to 512
  - [-1, 1, C3k2, [512, True]] # reduced repeats from 2 to 1, channels from 1024 to 512
  - [-1, 1, SPPF, [512, 5]] # 9 - reduced from 1024 to 512
  - [-1, 1, C2PSA, [512]] # 10 - reduced from 1024 to 512, reduced repeats from 2 to 1

# YOLO11n-pose lightweight head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, C3k2, [256, False]] # 13 - reduced repeats from 2 to 1, channels from 512 to 256

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, C3k2, [128, False]] # 16 (P3/8-small) - reduced repeats from 2 to 1, channels from 256 to 128

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 1, C3k2, [256, False]] # 19 (P4/16-medium) - reduced repeats from 2 to 1, channels from 512 to 256

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [512, True]] # 22 (P5/32-large) - reduced repeats from 2 to 1, channels from 1024 to 512

  - [[16, 19, 22], 1, Pose, [nc, kpt_shape]] # Detect(P3, P4, P5)
