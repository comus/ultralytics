# Parameters
nc: 80 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants
  lite: [0.5, 0.25, 512] # 保持深度縮放為0.5確保特徵提取能力

# YOLO11n-pose平衡輕量化backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 1-P2/4
  - [-1, 1, C3k2, [128, False, 0.25]] # 減少早期重複次數為1
  - [-1, 1, Conv, [128, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [256, False, 0.25]] # 保持重複次數為2，這層對關鍵點定位很重要
  - [-1, 1, Conv, [256, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [256, True]] # 保持重複次數為2，這層對關鍵點空間關係很重要
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32
  - [-1, 1, C3k2, [512, True]] # 減少高層重複次數為1
  - [-1, 1, SPPF, [512, 5]] # 9
  - [-1, 1, C2PSA, [512]] # 10 - 使用1次重複，但保持通道數

# YOLO11n-pose平衡輕量化head (保障姿勢識別能力)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [256, False]] # 13 - 保持重複次數為2，這對多尺度特徵融合很重要

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [128, False]] # 16 (P3/8-small) - 保持重複次數為2，這對小目標關鍵點很重要

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [256, False]] # 19 (P4/16-medium) - 保持重複次數為2

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [512, True]] # 22 (P5/32-large) - 減少重複次數為1，但保持通道數

  - [[16, 19, 22], 1, Pose, [nc, kpt_shape]] # Detect(P3, P4, P5)
  