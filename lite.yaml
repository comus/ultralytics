# YOLOv11n-pose-lite-enhanced
nc: 80  # 類別數
kpt_shape: [17, 3]  # 關鍵點形狀 [數量, 維度]

# 縮放係數
scales:
  lite: [0.50, 0.30, 512]  # 我們的模型

# 優化骨幹
backbone:
  - [-1, 1, Conv, [24, 3, 2]]                # 0
  - [-1, 1, Conv, [48, 3, 2]]                # 1
  - [-1, 1, RepC3, [48, 1, 1.0]]             # 2 - 使用RepC3替代C3k2
  - [-1, 1, Conv, [96, 3, 2]]                # 3
  - [-1, 1, RepC3, [96, 2, 1.0]]             # 4
  - [-1, 1, Conv, [192, 3, 2]]               # 5
  - [-1, 1, RepC3, [192, 2, 1.0]]            # 6
  - [-1, 1, Conv, [384, 3, 2]]               # 7
  - [-1, 1, RepC3, [384, 1, 1.0]]            # 8
  - [-1, 1, SPPF, [384, 5]]                  # 9
  - [-1, 1, C2f, [384, 1, 0.5]]              # 10 - 注意力增強模塊

# 特徵金字塔網絡頭
head:
  # FPN上採樣路徑
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 1, Conv, [192, 1, 1]]                  # 13
  - [-1, 1, RepC3, [192, 1, 1.0]]               # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]                   # 16
  - [-1, 1, Conv, [96, 1, 1]]                   # 17
  - [-1, 1, RepC3, [96, 1, 1.0]]                # 18

  # PAN下採樣路徑
  - [-1, 1, Conv, [96, 3, 2]]                   # 19
  - [[-1, 14], 1, Concat, [1]]                  # 20
  - [-1, 1, Conv, [192, 1, 1]]                  # 21
  - [-1, 1, RepC3, [192, 1, 1.0]]               # 22

  - [-1, 1, Conv, [192, 3, 2]]                  # 23
  - [[-1, 10], 1, Concat, [1]]                  # 24
  - [-1, 1, Conv, [384, 1, 1]]                  # 25
  - [-1, 1, RepC3, [384, 1, 1.0]]               # 26

  # 增強姿態頭
  - [[18, 22, 26], 1, Pose, [nc, kpt_shape]]  # 27
