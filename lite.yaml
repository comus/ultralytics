# YOLOv11n-pose-lite-enhanced: 輕量高效多人姿態檢測模型 (增強版)
# Parameters
nc: 80  # number of classes
kpt_shape: [17, 3]  # [number of keypoints, number of dims per keypoint]

# 模型縮放係數設定
scales: # model compound scaling constants
  # [depth, width, max_channels]
  lite: [0.50, 0.25, 1024]  # 增強輕量版: ~1.1M params, ~3.8 GFLOPs

# 優化輕量化骨幹 (使用2的倍數和安全的縮放因子)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2  # 從8增加到16
  - [-1, 1, Conv, [32, 3, 2]]  # 1-P2/4  # 從16增加到32
  - [-1, 1, C3k2, [32, False, 0.5]]  # 2
  - [-1, 1, SCDown, [64, 3, 2]]  # 3-P3/8  # 從32增加到64
  - [-1, 1, C3k2, [64, False, 0.5]]  # 4
  - [-1, 1, SCDown, [128, 3, 2]]  # 5-P4/16  # 保持128
  - [-1, 1, C3k2, [128, False, 0.5]]  # 6
  - [-1, 1, SCDown, [256, 3, 2]]  # 7-P5/32  # 從128增加到256
  - [-1, 1, C3k2, [256, False, 0.5]]  # 8
  - [-1, 1, SPPF, [256, 5]]  # 9
  - [-1, 1, C2PSA, [256, 1]]  # 10 - 適配C2PSA正確格式

# 優化輕量化頭部
head:
  # 上採樣路徑
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]  # 12
  - [-1, 1, Conv, [128, 1, 1]]  # 13  # 將384通道降為128
  - [-1, 1, C3k2, [128, False, 0.5]]  # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]  # 16
  - [-1, 1, Conv, [64, 1, 1]]  # 17  # 將192通道降為64
  - [-1, 1, C3k2, [64, False, 0.5]]  # 18  # 使用安全的縮放因子0.5

  # 下採樣路徑
  - [-1, 1, SCDown, [64, 3, 2]]  # 19
  - [[-1, 14], 1, Concat, [1]]  # 20
  - [-1, 1, Conv, [128, 1, 1]]  # 21
  - [-1, 1, C3k2, [128, False, 0.5]]  # 22  # 使用安全的縮放因子0.5

  - [-1, 1, SCDown, [128, 3, 2]]  # 23
  - [[-1, 10], 1, Concat, [1]]  # 24 - 連接到PSA層
  - [-1, 1, Conv, [256, 1, 1]]  # 25
  - [-1, 1, C3k2, [256, False, 0.5]]  # 26  # 使用安全的縮放因子0.5

  # 姿態檢測頭
  - [[18, 22, 26], 1, Pose, [nc, kpt_shape]]  # 27
