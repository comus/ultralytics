# Parameters
nc: 80 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants
  lite: [0.5, 0.25, 512] # 使用標準縮放因子

# 極度輕量化但專注於姿態估計的backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [24, 3, 2]] # 0-P1/2 - 大幅減少第一層通道數
  - [-1, 1, Conv, [48, 3, 2]] # 1-P2/4 - 大幅減少第二層通道數
  - [-1, 1, C3k, [64, False, 0.5, 5]] # 使用大核卷積(k=5)以增加感受野，彌補深度減少
  - [-1, 1, Conv, [80, 3, 2]] # 3-P3/8 - 使用非標準通道數以優化效率
  - [-1, 1, C3k, [160, False, 0.5, 5]] # 使用大核卷積，保持低通道數但增大感受野
  - [-1, 1, Conv, [160, 3, 2]] # 5-P4/16 - 保持通道數不變以節約參數
  - [-1, 1, C3k2, [160, True, 0.5]] # 使用C3k2增強特徵提取但控制通道數
  - [-1, 1, Conv, [320, 3, 2]] # 7-P5/32 - 僅增加2倍通道數而非標準的2.5倍
  - [-1, 1, C3k2, [320, True, 0.5]] # 8 - 使用較低通道數
  - [-1, 1, SPPF, [320, 7]] # 9 - 使用更大的池化核心(k=7)增強特徵整合
  - [-1, 1, C2PSA, [320, 0.75]] # 10 - 增大PSA的縮放因子以強化注意力機制

# 專門為姿態估計優化的輕量級頭部
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k, [160, False, 0.5, 5]] # 13 - 使用大核卷積增強特徵

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k, [80, False, 0.5, 5]] # 16 (P3/8-small) - 使用大核卷積優化小尺度特徵

  - [-1, 1, Conv, [80, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k, [160, False, 0.5, 5]] # 19 (P4/16-medium) - 同上，增強中尺度特徵

  - [-1, 1, Conv, [160, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k, [320, True, 0.5, 5]] # 22 (P5/32-large) - 減少重複次數但使用大核增強大尺度特徵

  - [[16, 19, 22], 1, Pose, [nc, kpt_shape]] # Detect(P3, P4, P5)
