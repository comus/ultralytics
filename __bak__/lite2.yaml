# YOLOv11n-pose-lite-psa: 優化版輕量高效多人姿態檢測模型
# Parameters
nc: 80  # number of classes
kpt_shape: [17, 3]  # [number of keypoints, number of dims per keypoint]

# 模型縮放係數設定
scales: # model compound scaling constants
  # [depth, width, max_channels]
  lite: [1.0, 1.0, 512]  # 優化輕量版: ~1.5M params, ~5.0 GFLOPs

# 優化的骨幹 (使用2的冪次)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2  # 使用16通道
  - [-1, 1, Conv, [32, 3, 2]]  # 1-P2/4  # 使用32通道
  - [-1, 1, C3k2, [32, False, 0.7]]  # 2  # 適度擴展比例
  - [-1, 1, SCDown, [32, 3, 2]]  # 3-P3/8
  - [-1, 1, C3k2, [32, False, 0.7]]  # 4  # 保持擴展比例
  - [-1, 1, SCDown, [64, 3, 2]]  # 5-P4/16  # 使用64通道
  - [-1, 1, C3k2, [64, False, 0.7]]  # 6  # 保持擴展比例
  - [-1, 1, SCDown, [128, 3, 2]]  # 7-P5/32  # 使用128通道
  - [-1, 1, C3k2, [128, False, 0.7]]  # 8  # 保持擴展比例
  - [-1, 1, SPPF, [128, 5]]  # 9  # 保持通道數
  - [-1, 1, C2PSA, [128, 1]]  # 10 - 維持PSA層

# 優化的頭部
head:
  # 上採樣路徑
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]  # 12
  - [-1, 1, Conv, [64, 1, 1]]  # 13  # 使用64通道
  - [-1, 1, C3k2, [64, False, 0.7]]  # 14  # 保持擴展比例

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]  # 16
  - [-1, 1, Conv, [32, 1, 1]]  # 17  # 使用32通道
  - [-1, 1, C3k2, [32, False, 0.7]]  # 18  # 保持擴展比例

  # 下採樣路徑
  - [-1, 1, SCDown, [32, 3, 2]]  # 19  # 使用32通道
  - [[-1, 14], 1, Concat, [1]]  # 20
  - [-1, 1, Conv, [64, 1, 1]]  # 21  # 使用64通道
  - [-1, 1, C3k2, [64, False, 0.7]]  # 22  # 保持擴展比例

  - [-1, 1, SCDown, [64, 3, 2]]  # 23  # 使用64通道
  - [[-1, 10], 1, Concat, [1]]  # 24
  - [-1, 1, Conv, [128, 1, 1]]  # 25  # 使用128通道
  - [-1, 1, C3k2, [128, False, 0.7]]  # 26  # 保持擴展比例

  # 姿態檢測頭
  - [[18, 22, 26], 1, Pose, [nc, kpt_shape]]  # 27