# YOLOv11n-pose-slim: 輕量高效姿態檢測模型 (不使用知識蒸餾)
nc: 80  # 類別數
kpt_shape: [17, 3]  # 關鍵點形狀 [數量, 維度]

# 縮放係數設定 - 平衡輕量化與直接訓練精度
scales:
  slim: [0.42, 0.33, 384]  # 直接訓練優化版: ~2.8M 參數

# 高效骨幹網絡
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]                # 0-P1/2  
  - [-1, 1, Conv, [96, 3, 2]]                # 1-P2/4
  - [-1, 1, RepC3, [96, 1, 0.8]]             # 2 - 較高的擴展率
  - [-1, 1, Conv, [128, 3, 2]]               # 3-P3/8
  - [-1, 1, RepC3, [128, 2, 0.8]]            # 4 - 增加一層以提高特徵質量
  - [-1, 1, Conv, [160, 3, 2]]               # 5-P4/16
  - [-1, 1, RepC3, [160, 2, 0.8]]            # 6 - 同樣增加一層
  - [-1, 1, Conv, [192, 3, 2]]               # 7-P5/32
  - [-1, 1, RepC3, [192, 1, 0.8]]            # 8
  - [-1, 1, SPPF, [192, 5]]                  # 9
  - [-1, 1, C2f, [192, 1, 0.5]]              # 10 - 使用標準C2f，不用輕量版

# 平衡特徵金字塔頭
head:
  # 上採樣路徑
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 1, RepC3, [160, 1, 0.8]]               # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 1, RepC3, [128, 1, 0.8]]               # 16

  # 下採樣路徑
  - [-1, 1, Conv, [128, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18
  - [-1, 1, RepC3, [160, 1, 0.8]]               # 19

  - [-1, 1, Conv, [160, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21
  - [-1, 1, RepC3, [192, 1, 0.8]]               # 22

  # 精度優先的姿態頭
  - [[16, 19, 22], 1, PrecisionPose, [nc, kpt_shape]]  # 23
