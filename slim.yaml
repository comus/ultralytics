# YOLOv11n-pose-slim: 輕量高效姿態檢測模型
nc: 80  # 類別數
kpt_shape: [17, 3]  # 關鍵點形狀 [數量, 維度]

# 縮放係數設定
scales:
  slim: [0.42, 0.38, 512]  # 我們的模型: ~1.8M 參數, ~5.0 GFLOPs

# 高效骨幹網絡
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [56, 3, 2]]                # 0-P1/2  
  - [-1, 1, Conv, [112, 3, 2]]               # 1-P2/4
  - [-1, 1, RepC3, [128, 2]]                 # 2 - 移除擴展因子，使用默認值
  - [-1, 1, Conv, [192, 3, 2]]               # 3-P3/8
  - [-1, 1, RepC3, [256, 2]]                 # 4
  - [-1, 1, Conv, [320, 3, 2]]               # 5-P4/16
  - [-1, 1, RepC3, [384, 2]]                 # 6
  - [-1, 1, Conv, [512, 3, 2]]               # 7-P5/32
  - [-1, 1, RepC3, [512, 1]]                 # 8
  - [-1, 1, SPPF, [512, 5]]                  # 9
  - [-1, 1, LightC2f, [512, 1, 0.5]]         # 10 - 輕量化C2f

# 高效特徵金字塔頭
head:
  # 上採樣路徑
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 1, RepC3, [384, 1]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 1, RepC3, [256, 1]]                    # 16

  # 下採樣路徑
  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18
  - [-1, 1, RepC3, [384, 1]]                    # 19

  - [-1, 1, Conv, [384, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21
  - [-1, 1, RepC3, [512, 1]]                    # 22

  # 增強姿態頭
  - [[16, 19, 22], 1, Pose, [nc, kpt_shape]]  # 23
