# YOLOv11n-pose-slim: 輕量高效姿態檢測模型 (優化精度)
nc: 80  # 類別數
kpt_shape: [17, 3]  # 關鍵點形狀 [數量, 維度]

# 縮放係數設定 - 平衡輕量化與精度
scales:
  slim: [0.4, 0.3, 384]  # 平衡版本: ~2.5M 參數

# 高效骨幹網絡
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [40, 3, 2]]                # 0-P1/2
  - [-1, 1, Conv, [80, 3, 2]]                # 1-P2/4
  - [-1, 1, RepC3, [96, 1, 0.75]]            # 2 - 適中的擴展率
  - [-1, 1, Conv, [128, 3, 2]]               # 3-P3/8
  - [-1, 1, RepC3, [128, 1, 0.75]]           # 4
  - [-1, 1, Conv, [160, 3, 2]]               # 5-P4/16
  - [-1, 1, RepC3, [160, 1, 0.75]]           # 6
  - [-1, 1, Conv, [192, 3, 2]]               # 7-P5/32
  - [-1, 1, RepC3, [192, 1, 0.75]]           # 8
  - [-1, 1, SPPF, [192, 5]]                  # 9
  - [-1, 1, LightC2f, [192, 1, 0.5]]         # 10 - 適度的LightC2f

# 平衡特徵金字塔頭
head:
  # 上採樣路徑
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 1, RepC3, [160, 1, 0.75]]              # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 1, RepC3, [128, 1, 0.75]]              # 16

  # 下採樣路徑
  - [-1, 1, Conv, [128, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18
  - [-1, 1, RepC3, [160, 1, 0.75]]              # 19

  - [-1, 1, Conv, [160, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21
  - [-1, 1, RepC3, [192, 1, 0.75]]              # 22

  # 優化姿態頭
  - [[16, 19, 22], 1, Pose, [nc, kpt_shape]]  # 23
